name: ci
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
    env:
      AZURE_VAULT_NAME: kv${{ github.run_id }}-${{ matrix.node-version }}-${{ github.run_attempt }}
      AZURE_DEFAULTS_GROUP: ${{ secrets.KEYVAULT_RESOURCE_GROUP }}
      AZURE_DEFAULTS_LOCATION: westeurope
    steps:
      - name: Log in with Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run lint
      - uses: azure/CLI@v3
        with:
          inlineScript: |
            az account show

            # `az keyvault create` defaults to RBAC authorization, which rejects
            # access policies. Opt back into access policies so the vault is created
            # with a full self-policy for the CI service principal.
            az keyvault create --name ${{ env.AZURE_VAULT_NAME }} --enable-rbac-authorization false
      - run: npm run test
      - uses: azure/CLI@v3
        if: ${{ always() }}
        with:
          inlineScript: |
            az keyvault delete --name ${{ env.AZURE_VAULT_NAME }}
  automerge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
